spring.application.name=EcommerceSpring
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#This tells springboot which JDBC driver class to use.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Tells hibernate to print all the generated SQL queries to console, used for debugging.
spring.jpa.show-sql=true
#Specifies the SQL dialect hibernate should use.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#controls how hibernate handles schema generation. can be none,create,create-drop or update
spring.jpa.hibernate.ddl-auto=validate
server.port=${PORT}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
